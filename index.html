<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seguimiento de Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --surface2: #F0EEE9;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --text: #1A1917;
    --text2: #6B6860;
    --text3: #9B9890;
    --accent: #1A1917;
    --urgent: #C04A22;
    --urgent-bg: #FAECE7;
    --today: #A06010;
    --today-bg: #FEF3DC;
    --ok: #1A6645;
    --ok-bg: #E1F5EE;
    --radius: 10px;
    --radius-lg: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141412;
      --surface: #1F1E1B;
      --surface2: #2A2926;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.15);
      --text: #F0EDE8;
      --text2: #9B9890;
      --text3: #6B6860;
      --urgent: #F08060;
      --urgent-bg: rgba(200,80,40,0.15);
      --today: #EFB040;
      --today-bg: rgba(200,140,30,0.15);
      --ok: #40C080;
      --ok-bg: rgba(30,140,90,0.15);
    }
  }

  html { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  body { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

  header { margin-bottom: 2rem; }
  header h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
  header p { font-size: 13px; color: var(--text2); margin-top: 4px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 1.75rem; }
  .stat { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 0.9rem 1rem; }
  .stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .stat-val { font-size: 26px; font-weight: 300; font-family: 'DM Mono', monospace; }
  .stat-val.red { color: var(--urgent); }
  .stat-val.amber { color: var(--today); }

  .toolbar { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; align-items: center; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .filter-btn { height: 30px; padding: 0 12px; border: 0.5px solid var(--border); border-radius: 99px; background: transparent; cursor: pointer; font-size: 12px; color: var(--text2); font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .filter-btn:hover { border-color: var(--border2); color: var(--text); }
  .filter-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  .btn-new { height: 34px; padding: 0 16px; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; gap: 6px; white-space: nowrap; transition: opacity 0.15s; }
  .btn-new:hover { opacity: 0.85; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; display: none; align-items: center; justify-content: center; padding: 1rem; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); padding: 1.5rem; width: 100%; max-width: 480px; border: 0.5px solid var(--border2); }
  .modal h2 { font-size: 16px; font-weight: 500; margin-bottom: 1.25rem; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; height: 36px; padding: 0 10px;
    border: 0.5px solid var(--border2); border-radius: var(--radius);
    background: var(--surface2); color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    outline: none; transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--text2); }
  .field textarea { height: 72px; padding: 8px 10px; resize: none; line-height: 1.5; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; }
  .btn-cancel { height: 34px; padding: 0 14px; background: transparent; border: 0.5px solid var(--border2); border-radius: var(--radius); cursor: pointer; font-size: 13px; color: var(--text2); font-family: 'DM Sans', sans-serif; }
  .btn-cancel:hover { color: var(--text); }
  .btn-save { height: 34px; padding: 0 18px; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; }
  .btn-save:hover { opacity: 0.85; }

  .section-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; margin-top: 1.5rem; }
  .section-label:first-of-type { margin-top: 0; }

  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.1rem; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 12px; transition: border-color 0.15s; }
  .card:hover { border-color: var(--border2); }
  .card.is-urgent { border-left: 2.5px solid var(--urgent); }
  .card.is-today { border-left: 2.5px solid var(--today); }

  .avatar { width: 40px; height: 40px; min-width: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; margin-top: 1px; }
  .av0 { background: #E6F1FB; color: #0C447C; }
  .av1 { background: #E1F5EE; color: #085041; }
  .av2 { background: #EEEDFE; color: #3C3489; }
  .av3 { background: #FAECE7; color: #712B13; }
  .av4 { background: #FAEEDA; color: #633806; }

  .card-body { flex: 1; min-width: 0; }
  .card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .card-name { font-size: 14px; font-weight: 500; }
  .card-company { font-size: 12px; color: var(--text2); }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
  .badge-urgent { background: var(--urgent-bg); color: var(--urgent); }
  .badge-today { background: var(--today-bg); color: var(--today); }
  .badge-soon { background: var(--ok-bg); color: var(--ok); }
  .badge-high { background: var(--surface2); color: var(--text2); border: 0.5px solid var(--border2); }
  .card-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text2); margin-top: 4px; }
  .card-meta span { display: flex; align-items: center; gap: 4px; }
  .topic-pill { background: var(--surface2); border-radius: 99px; padding: 1px 8px; font-size: 11px; color: var(--text2); }
  .card-note { font-size: 12px; color: var(--text3); font-style: italic; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 400px; }

  .card-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-icon { width: 32px; height: 32px; border-radius: var(--radius); border: 0.5px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--text2); transition: all 0.15s; }
  .btn-icon:hover { background: var(--surface2); border-color: var(--border2); }
  .btn-check:hover { color: var(--ok); border-color: var(--ok); }
  .btn-trash:hover { color: var(--urgent); border-color: var(--urgent); }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--text3); }
  .empty i { font-size: 32px; display: block; margin-bottom: 10px; }
  .empty p { font-size: 14px; }

  @media (max-width: 480px) {
    body { padding: 1.25rem 1rem 3rem; }
    .field-row { flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <h1>Seguimiento de clientes</h1>
  <p>Solo los pendientes de respuesta. Cuando respondan, los marcas y desaparecen.</p>
</header>

<div class="stats" id="stats"></div>

<div class="toolbar">
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">Todos</button>
    <button class="filter-btn" data-filter="urgent">Vencidos</button>
    <button class="filter-btn" data-filter="today">Hoy</button>
    <button class="filter-btn" data-filter="soon">Próximos 3 días</button>
    <button class="filter-btn" data-filter="high">Alta prioridad</button>
  </div>
  <button class="btn-new" onclick="openModal()">
    <i class="ti ti-plus" aria-hidden="true"></i> Agregar cliente
  </button>
</div>

<div id="list"></div>

<div class="modal-overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Nuevo cliente</h2>
    <div class="field-row">
      <div class="field">
        <label>Nombre *</label>
        <input id="fName" type="text" placeholder="Ej: María García" />
      </div>
      <div class="field">
        <label>Empresa</label>
        <input id="fCompany" type="text" placeholder="Ej: Acme S.A." />
      </div>
    </div>
    <div class="field">
      <label>Tema de la charla</label>
      <input id="fTopic" type="text" placeholder="Ej: Propuesta de diseño web" />
    </div>
    <div class="field-row">
      <div class="field">
        <label>Fecha de la charla</label>
        <input id="fTalkDate" type="date" />
      </div>
      <div class="field">
        <label>Recordarme el</label>
        <input id="fRemind" type="date" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Prioridad</label>
        <select id="fPriority">
          <option value="normal">Normal</option>
          <option value="high">Alta</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Notas</label>
      <textarea id="fNote" placeholder="Detalles importantes de la conversación..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveClient()">Guardar</button>
    </div>
  </div>
</div>

<script>
  const COLORS = ['av0','av1','av2','av3','av4'];
  let clients = JSON.parse(localStorage.getItem('sc_clients') || '[]');
  let currentFilter = 'all';

  function persist() { localStorage.setItem('sc_clients', JSON.stringify(clients)); }

  function todayStr() { return new Date().toISOString().split('T')[0]; }

  function daysDiff(d) {
    if (!d) return null;
    const a = new Date(d + 'T00:00:00'), b = new Date(todayStr() + 'T00:00:00');
    return Math.round((a - b) / 86400000);
  }

  function initials(n) {
    return n.trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join('');
  }

  function colorFor(n) {
    let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % COLORS.length;
    return COLORS[h];
  }

  function getStatus(c) {
    const d = daysDiff(c.remindDate);
    if (c.remindDate && d < 0) return 'urgent';
    if (c.remindDate && d === 0) return 'today';
    if (c.remindDate && d <= 3) return 'soon';
    return 'normal';
  }

  function openModal() {
    document.getElementById('fTalkDate').value = todayStr();
    document.getElementById('overlay').classList.add('open');
    document.getElementById('fName').focus();
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
    ['fName','fCompany','fTopic','fTalkDate','fRemind','fNote'].forEach(id => {
      const el = document.getElementById(id);
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.value = '';
    });
    document.getElementById('fPriority').value = 'normal';
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('overlay')) closeModal();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  function saveClient() {
    const name = document.getElementById('fName').value.trim();
    if (!name) { document.getElementById('fName').focus(); return; }
    clients.push({
      id: Date.now(),
      name,
      company: document.getElementById('fCompany').value.trim(),
      topic: document.getElementById('fTopic').value.trim(),
      talkDate: document.getElementById('fTalkDate').value || todayStr(),
      remindDate: document.getElementById('fRemind').value || '',
      priority: document.getElementById('fPriority').value,
      note: document.getElementById('fNote').value.trim(),
    });
    persist();
    closeModal();
    render();
  }

  function markDone(id) {
    clients = clients.filter(c => c.id !== id);
    persist(); render();
  }

  function del(id) {
    if (!confirm('¿Eliminar este cliente?')) return;
    clients = clients.filter(c => c.id !== id);
    persist(); render();
  }

  document.getElementById('filters').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    currentFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });

  function render() {
    const urgent = clients.filter(c => getStatus(c) === 'urgent').length;
    const todayC = clients.filter(c => getStatus(c) === 'today').length;
    const high = clients.filter(c => c.priority === 'high').length;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="stat-label">Total pendientes</div><div class="stat-val">${clients.length}</div></div>
      <div class="stat"><div class="stat-label">Vencidos</div><div class="stat-val ${urgent>0?'red':''}">${urgent}</div></div>
      <div class="stat"><div class="stat-label">Recordar hoy</div><div class="stat-val ${todayC>0?'amber':''}">${todayC}</div></div>
      <div class="stat"><div class="stat-label">Alta prioridad</div><div class="stat-val">${high}</div></div>
    `;

    let filtered = clients;
    if (currentFilter === 'urgent') filtered = clients.filter(c => getStatus(c) === 'urgent');
    else if (currentFilter === 'today') filtered = clients.filter(c => getStatus(c) === 'today');
    else if (currentFilter === 'soon') filtered = clients.filter(c => ['today','soon'].includes(getStatus(c)));
    else if (currentFilter === 'high') filtered = clients.filter(c => c.priority === 'high');

    const sorted = [...filtered].sort((a,b) => {
      const s = {urgent:0,today:1,soon:2,normal:3};
      const diff = s[getStatus(a)] - s[getStatus(b)];
      if (diff !== 0) return diff;
      return a.priority === 'high' && b.priority !== 'high' ? -1 : 1;
    });

    if (sorted.length === 0) {
      document.getElementById('list').innerHTML = `
        <div class="empty">
          <i class="ti ti-check" aria-hidden="true"></i>
          <p>${currentFilter === 'all' ? 'Aún no hay clientes. Presiona "Agregar cliente" para empezar.' : 'No hay clientes en este filtro.'}</p>
        </div>`;
      return;
    }

    const groups = { urgent: [], today: [], soon: [], normal: [] };
    sorted.forEach(c => groups[getStatus(c)].push(c));

    const labels = { urgent: 'Vencidos', today: 'Recordar hoy', soon: 'Próximos días', normal: 'Sin fecha de recordatorio' };

    let html = '';
    for (const [key, label] of Object.entries(labels)) {
      if (groups[key].length === 0) continue;
      html += `<div class="section-label">${label}</div>`;
      html += groups[key].map(c => {
        const status = getStatus(c);
        const diff = daysDiff(c.remindDate);
        let badge = '';
        if (status === 'urgent') badge = `<span class="badge badge-urgent"><i class="ti ti-alert-circle" aria-hidden="true"></i> Vencido hace ${Math.abs(diff)} día${Math.abs(diff)!==1?'s':''}</span>`;
        else if (status === 'today') badge = `<span class="badge badge-today"><i class="ti ti-bell" aria-hidden="true"></i> Hoy</span>`;
        else if (status === 'soon') badge = `<span class="badge badge-soon">En ${diff} día${diff!==1?'s':''}</span>`;

        const prioBadge = c.priority === 'high' ? `<span class="badge badge-high">Alta prioridad</span>` : '';

        return `<div class="card ${status==='urgent'?'is-urgent':status==='today'?'is-today':''}">
          <div class="avatar ${colorFor(c.name)}">${initials(c.name)}</div>
          <div class="card-body">
            <div class="card-top">
              <span class="card-name">${c.name}</span>
              ${c.company ? `<span class="card-company">${c.company}</span>` : ''}
              ${badge}
              ${prioBadge}
            </div>
            <div class="card-meta">
              ${c.topic ? `<span class="topic-pill"><i class="ti ti-message-circle" aria-hidden="true"></i> ${c.topic}</span>` : ''}
              ${c.talkDate ? `<span><i class="ti ti-calendar" aria-hidden="true"></i> Charla: ${c.talkDate}</span>` : ''}
              ${c.remindDate ? `<span><i class="ti ti-bell" aria-hidden="true"></i> Recordar: ${c.remindDate}</span>` : ''}
            </div>
            ${c.note ? `<div class="card-note">${c.note}</div>` : ''}
          </div>
          <div class="card-actions">
            <button class="btn-icon btn-check" onclick="markDone(${c.id})" title="Ya respondió — remover" aria-label="Marcar como respondido">
              <i class="ti ti-check" aria-hidden="true"></i>
            </button>
            <button class="btn-icon btn-trash" onclick="del(${c.id})" title="Eliminar" aria-label="Eliminar cliente">
              <i class="ti ti-trash" aria-hidden="true"></i>
            </button>
          </div>
        </div>`;
      }).join('');
    }

    document.getElementById('list').innerHTML = html;
  }

  render();
</script>
</body>
</html>
